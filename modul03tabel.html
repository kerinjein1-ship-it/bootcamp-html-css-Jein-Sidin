<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 03 - Tabel</title>
    <link rel="stylesheet" href="tabel.css">
</head>
<body>
    <h1>Modul 03 - Tabel</h1>
   <table>
    <tr>    
        <th>Nama</th>    
        <th>Kota</th>  
    </tr>  
    <tr>    
        <td>Rina</td>    
        <td>Makassar</td>  
    </tr>  
    <tr>    
        <td>Budi</td>    
        <td>Bandung</td>  
    </tr> 
    
</table> 

    <hr/>
    <h2>Tabel Terstruktur</h2>
    <table>
    <thead>
        <tr>
            <th scope="col">Tempat</th>    
            <th scope="col">Dewasa</th>    
            <th scope="col">Anak-anak</th>    
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row">Benteng Rotterdam</th>
            <td>Rp10.000</td>
            <td>Rp5.000</td>
        </tr>
        <tr>
            <th>Pantai Losari</th>
            <td>Rp10.000</td>
            <td>Rp5.000</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">Harga dapat berubah sewaktu-waktu</td>
        </tr>
    </tfoot>
    </table>
    
</body>
</html>
